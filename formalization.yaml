version: "v0.4"

project:
  name: "Passive Quantum Memory in Three Dimensions"
  description: >-
    Lean 4 (v4.35.0) formalization of a three-dimensional passive quantum memory on open 3D
    cubic lattices (based on a three-layer variant of the Balasubramanian–Davydova–Lin multiscale
    welded CSS hierarchy), certifying standalone existential challenge theorems for:
    (1) simultaneous positive-temperature unperturbed Gibbs & KMS/CPTP-Davies thermal memory
    stability (β > β_c) and zero-temperature superpolynomial perturbative & closed-system unitary
    memory stability (Part I); and
    (2) simultaneous positive-temperature fixed-window (β ∈ (β_c, β_max]) bare and logarithmic-cooling
    (β ≥ C_scale log L) QAC-dressed Gibbs failure probability and KMS-symmetric dissipative memory
    lifetime bounds under general finite-range perturbations of constant O(1) coupling strength
    (Part II).
  authors:
    - "Patrick Hayden"
  responsible_maintainers:
    - "Patrick Hayden"
  license: "Apache-2.0"

classification:
  arxiv:
    - "quant-ph"
    - "math-ph"
    - "cond-mat.stat-mech"
  msc2020:
    - "81P73"
    - "82B10"
    - "82C10"
    - "81V70"

sources:
  - title: "Passive Quantum Memory in Three Dimensions, Part I: Thermal and Zero-Temperature Perturbative Stability"
    authors:
      - "Patrick Hayden"
    type: "article"
    location: "Section 7.4, Theorem 7.5"
    relationship: "formalizes"
    author_endorsement: "participated"
  - title: "Passive Quantum Memory in Three Dimensions, Part II: Robust Thermal Stability"
    authors:
      - "Patrick Hayden"
    type: "article"
    location: "Section 6.3, Theorems 6.3, 6.4, and 6.5"
    relationship: "formalizes"
    author_endorsement: "participated"
  - title: "A passive self-correcting quantum memory in three dimensions"
    authors:
      - "Shankar Balasubramanian"
      - "Margarita Davydova"
      - "Ting-Chun Lin"
    id: "https://arxiv.org/abs/2605.10943"
    type: "article"
    relationship: "adapts"
    note: "Introduces the multiscale welded 3D CSS code architecture adapted to three layers here."

automation:
