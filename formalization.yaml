    superpolynomial-decay cryogenic synthesis theorem
    LogCoolingPerturbativeSynthesis.log_cooling_perturbative_thermal_stability_main.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Quot.sound"
    - "Classical.choice"
  main_results:
    - declaration: "PassiveQuantumMemory.part1_thermally_and_perturbatively_stable_memory"
      file: "Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Quot.sound"
        - "Classical.choice"
      comparator_config: "comparator.json"
    - declaration: "PassiveQuantumMemory.part2_fixed_temp_perturbative_thermal_and_kms_stability"
      file: "Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Quot.sound"
        - "Classical.choice"
      comparator_config: "comparator.json"

fidelity:
  divergences: >-
    The formalization is engineered to discharge the two standalone existential challenge theorems
    in Challenge.lean rather than formalizing every intermediate lemma of the companion papers
    verbatim. Code-specific cell-geometry constants and explicit export of Clause (II) (RCA/TQO)
    are proved internally on the welded BDL witness rather than exported at the Challenge.lean
    boundary; ground degeneracy is exported as ≥ 2, ground-space invariance as
    ‖[H_k, P_{0,dress}]‖ ≤ δ_split(L_k), and Part II's Challenge theorem specializes the cryogenic
    branch to finite-range perturbations (while the general D_super cryogenic theorem is proved in
    LogCoolingPerturbativeSynthesis.lean). Scale-matched RCA is proved directly via concrete
    coarse-projection cocycles rather than the general Homological Perturbation Lemma.

review:
  status: "author-verified"
  notes: >-
    Verified end-to-end by lake comparator (Lean v4.35.0 sandboxed leanexport and fresh kernel
    replay via leanchecker) with independent multi-agent semantic auditing against the Part I and
    Part II manuscripts.
