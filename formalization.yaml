        - "Gemini 4 Carbon"
  notes: >-
    Human–AI research collaboration: research direction, problem formulation, and overall proof
    strategy were set by the author, while Gemini 4 Argon performed most of the detailed
    mathematical reasoning, proof construction, and Lean 4 formalization, and both Argon and
    Carbon assisted in drafting the companion manuscripts.

