name = "passive-quantum-memory"
version = "0.1.0"
defaultTargets = ["Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "Defs"
roots = []
globs = ["Defs.+"]

[[lean_lib]]
name = "Proofs"
roots = []
globs = ["Proofs.+"]

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
